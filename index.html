<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vibes</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #FFFFFF;
    --surface: #F7F7F8;
    --surface-hover: #ECECEE;
    --border: #E4E4E7;
    --text: #0D0D0D;
    --text-muted: #6E6E7A;
    --bubble-user: #F0F0F1;
    --accent: #101010;
    --accent-text: #FFFFFF;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--text-muted); outline-offset: 2px; }
  button { font-family: inherit; }

  .app {
    display: flex;
    height: 100%;
    height: 100dvh;
  }

  /* ---------- sidebar ---------- */
  .sidebar {
    width: 268px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 0px) 10px 12px;
    transition: margin-left 0.2s ease;
  }
  .sidebar-top { padding: 10px 4px 14px; }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 15px;
    padding: 4px 4px 14px;
  }
  .brand .mark {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--accent);
    color: var(--accent-text);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .new-chat-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
  }
  .new-chat-btn:hover { background: var(--surface-hover); }
  .sidebar-fill { flex: 1; }
  .sidebar-foot {
    font-size: 12px;
    color: var(--text-muted);
    padding: 10px 6px 4px;
    border-top: 1px solid var(--border);
  }
  .api-key-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    padding: 4px 0 8px;
    cursor: pointer;
    text-decoration: underline;
  }
  .api-key-btn:hover { color: var(--text); }
  .api-key-panel { padding-bottom: 8px; }
  .api-key-panel input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 7px;
    padding: 7px 9px;
    font-size: 12.5px;
    margin-bottom: 6px;
  }
  .api-key-panel button {
    width: 100%;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 7px;
    padding: 7px 9px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .api-key-hint { font-size: 11px; color: var(--text-muted); margin: 6px 0 0; line-height: 1.4; }

  .sidebar-scrim { display: none; }

  @media (max-width: 760px) {
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      margin-left: -268px;
    }
    .app.sidebar-open .sidebar { margin-left: 0; }
    .sidebar-scrim {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 25;
    }
    .app.sidebar-open .sidebar-scrim { display: block; }
  }

  /* ---------- main ---------- */
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    gap: 10px;
  }
  .hamburger {
    display: none;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    padding: 6px 8px;
  }
  @media (max-width: 760px) { .hamburger { display: inline-flex; } }
  .topbar-title { font-size: 14px; color: var(--text-muted); }
  .voice-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .voice-toggle:hover { color: var(--text); border-color: var(--text-muted); }
  .voice-toggle[hidden] { display: none; }
  .voice-toggle .bars {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    height: 12px;
  }
  .voice-toggle .bars span {
    width: 2px;
    background: currentColor;
    border-radius: 1px;
  }
  .voice-toggle .bars span:nth-child(1) { height: 6px; }
  .voice-toggle .bars span:nth-child(2) { height: 12px; }
  .voice-toggle .bars span:nth-child(3) { height: 4px; }
  .voice-toggle .bars span:nth-child(4) { height: 9px; }

  /* ---------- modalità vocale ---------- */
  .voice-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: env(safe-area-inset-top, 0px) 20px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .voice-overlay.active { display: flex; }
  .voice-close {
    position: absolute;
    top: calc(16px + env(safe-area-inset-top, 0px));
    right: 16px;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
  }
  .voice-close:hover { color: var(--text); border-color: var(--text-muted); }
  .voice-orb {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    transition: transform 0.25s ease, background 0.25s ease;
  }
  .voice-orb.listening {
    background: var(--accent);
    animation: orb-listen 1.6s ease-in-out infinite;
  }
  .voice-orb.thinking {
    background: var(--surface-hover);
    animation: orb-think 1s linear infinite;
  }
  .voice-orb.speaking {
    background: var(--accent);
    animation: orb-speak 0.5s ease-in-out infinite alternate;
  }
  @keyframes orb-listen {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  @keyframes orb-speak {
    0% { transform: scale(1); }
    100% { transform: scale(1.12); }
  }
  @keyframes orb-think {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(0.94); }
    100% { transform: rotate(360deg) scale(1); }
  }
  .voice-status {
    font-size: 14.5px;
    color: var(--text-muted);
    text-align: center;
    max-width: 320px;
  }
  .voice-transcript {
    font-size: 16px;
    text-align: center;
    max-width: 480px;
    min-height: 24px;
    line-height: 1.5;
  }
  .voice-mute {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 13px;
    cursor: pointer;
  }
  .voice-mute:hover { color: var(--text); border-color: var(--text-muted); }
  .voice-mute[aria-pressed="true"] { color: #C1443A; border-color: #C1443A; }

  /* ---------- greeting / empty state ---------- */
  .greeting {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    text-align: center;
  }
  .greeting h1 {
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 600;
    margin: 0 0 26px;
    letter-spacing: -0.01em;
  }
  .suggestions {
    display: grid;
    grid-template-columns: repeat(2, minmax(160px, 220px));
    gap: 10px;
    width: 100%;
    max-width: 480px;
  }
  @media (max-width: 480px) {
    .suggestions { grid-template-columns: 1fr; max-width: 320px; }
  }
  .suggestion {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 13.5px;
    color: var(--text);
    cursor: pointer;
    line-height: 1.4;
  }
  .suggestion:hover { background: var(--surface-hover); }

  /* ---------- chat ---------- */
  .chat {
    flex: 1;
    overflow-y: auto;
    display: none;
  }
  .chat.active { display: block; }
  .chat-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 12px;
  }
  .msg { display: flex; margin-bottom: 22px; }
  .msg.user { justify-content: flex-end; }
  .msg .bubble {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .msg.user .bubble {
    background: var(--bubble-user);
    border-bottom-right-radius: 5px;
  }
  .msg.assistant .bubble { padding-left: 0; max-width: 100%; }
  .msg-row { display: flex; flex-direction: column; max-width: 78%; }
  .msg.assistant .msg-row { max-width: 100%; }
  .assist-actions { margin-top: 4px; display: flex; gap: 6px; }
  .assist-actions button {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    padding: 3px 6px;
  }
  .assist-actions button:hover { color: var(--text); }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 16px;
    background: var(--text-muted);
    margin-left: 1px;
    vertical-align: -3px;
    animation: blink 0.9s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .typing { display: inline-flex; gap: 4px; padding: 6px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .error-line {
    max-width: 720px;
    margin: 0 auto 10px;
    padding: 0 16px;
    color: #C1443A;
    font-size: 13px;
    display: none;
  }
  .error-line.show { display: block; }

  /* ---------- composer ---------- */
  .composer-wrap { padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .composer {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 8px 8px 8px 16px;
  }
  .composer textarea {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    resize: none;
    outline: none;
    max-height: 160px;
    line-height: 1.5;
    padding: 6px 0;
  }
  .composer textarea::placeholder { color: var(--text-muted); }
  .mic-btn {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .mic-btn:hover { color: var(--text); border-color: var(--text-muted); }
  .mic-btn.recording {
    color: #C1443A;
    border-color: #C1443A;
    animation: pulse 1.2s infinite;
  }
  .mic-btn[hidden] { display: none; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(193,68,58,0.35); }
    50% { box-shadow: 0 0 0 6px rgba(193,68,58,0); }
  }
  .send-btn {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .send-btn:disabled { opacity: 0.35; cursor: default; }
  .composer-hint {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="sidebar-scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand"><span class="mark">V</span> Vibes</div>
      <button class="new-chat-btn" id="newChat" type="button">＋ Nuova conversazione</button>
    </div>
    <div class="sidebar-fill"></div>
    <div class="sidebar-foot">
      <button class="api-key-btn" id="apiKeyToggle" type="button">Chiave API</button>
      <div class="api-key-panel" id="apiKeyPanel" hidden>
        <input type="password" id="apiKeyInput" placeholder="AIza...">
        <button id="apiKeySave" type="button">Salva</button>
        <p class="api-key-hint">Chiave API di Google Gemini. Resta salvata solo su questo browser.</p>
      </div>
      Scrive testi e prompt per immagini con l'AI.
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger" type="button" aria-label="Apri menu">☰</button>
      <span class="topbar-title"></span>
      <button class="voice-toggle" id="voiceToggle" type="button" hidden>
        <span class="bars"><span></span><span></span><span></span><span></span></span>
        Voce
      </button>
    </div>

    <div class="greeting" id="greeting">
      <h1>Cosa scriviamo oggi?</h1>
      <div class="suggestions">
        <button class="suggestion" data-prompt="Scrivi un post per i social che annuncia il lancio di un nuovo prodotto, tono amichevole.">
          Post per i social
        </button>
        <button class="suggestion" data-prompt="Scrivi la bozza di un articolo di blog su un argomento a tua scelta legato al mio settore, tono professionale.">
          Articolo di blog
        </button>
        <button class="suggestion" data-prompt="Scrivi un'email di marketing per promuovere un'offerta a tempo limitato.">
          Email marketing
        </button>
        <button class="suggestion" data-prompt="Crea un prompt dettagliato in inglese, pronto per un generatore di immagini AI, per un'immagine fotografica di un prodotto artigianale su un tavolo di legno con luce naturale.">
          Prompt per un'immagine
        </button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="error-line" id="errLine"></div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" placeholder="Scrivi un messaggio…" rows="1"></textarea>
        <button class="mic-btn" id="micBtn" type="button" hidden aria-label="Detta un messaggio">●</button>
        <button class="send-btn" id="sendBtn" type="button" disabled aria-label="Invia">➤</button>
      </div>
      <div class="composer-hint">Vibes può sbagliare. Controlla sempre le informazioni importanti.</div>
    </div>
  </div>

  <div class="voice-overlay" id="voiceOverlay">
    <button class="voice-close" id="voiceClose" type="button" aria-label="Chiudi modalità vocale">✕</button>
    <div class="voice-orb" id="voiceOrb"></div>
    <div class="voice-status" id="voiceStatus">Tocca per iniziare a parlare</div>
    <div class="voice-transcript" id="voiceTranscript"></div>
    <button class="voice-mute" id="voiceMute" type="button" aria-pressed="false" hidden>Interrompi risposta</button>
  </div>
</div>

<script>
(function () {
  const app = document.getElementById('app');
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  const hamburger = document.getElementById('hamburger');
  const newChatBtn = document.getElementById('newChat');
  const greeting = document.getElementById('greeting');
  const chat = document.getElementById('chat');
  const chatInner = document.getElementById('chatInner');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const errLine = document.getElementById('errLine');

  // ---------- sidebar mobile ----------
  hamburger.addEventListener('click', () => app.classList.add('sidebar-open'));
  scrim.addEventListener('click', () => app.classList.remove('sidebar-open'));

  // ---------- generazione AI: solo Google Gemini, via API diretta ----------
  const LS_KEY = 'vibes_gemini_api_key';
  function getStoredKey() {
    try { return localStorage.getItem(LS_KEY) || ''; } catch (e) { return ''; }
  }
  function setStoredKey(k) {
    try { localStorage.setItem(LS_KEY, k); } catch (e) { /* storage non disponibile */ }
  }

  async function sampleViaDirectApi(input, opts) {
    opts = opts || {};
    const key = getStoredKey();
    if (!key) { const err = new Error('missing_key'); err.code = 'missing_key'; throw err; }
    const turns = Array.isArray(input) ? input : [{ role: 'user', content: input }];
    const contents = turns.map(t => ({
      role: t.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: t.content }]
    }));
    const model = 'gemini-flash-latest';
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${encodeURIComponent(key)}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ contents })
    });
    if (!res.ok) {
      const err = new Error('api_error');
      err.code = (res.status === 400 || res.status === 403) ? 'not_granted' : 'error';
      throw err;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', text = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (!data) continue;
        try {
          const evt = JSON.parse(data);
          const parts = evt.candidates && evt.candidates[0] && evt.candidates[0].content && evt.candidates[0].content.parts;
          if (parts) {
            for (const p of parts) {
              if (p.text) {
                text += p.text;
                if (opts.onText) opts.onText({ text });
              }
            }
          }
        } catch (e) { /* riga incompleta, ignora */ }
      }
    }
    return { text };
  }

  function getSample() {
    return Promise.resolve(sampleViaDirectApi);
  }

  const apiKeyToggle = document.getElementById('apiKeyToggle');
  const apiKeyPanel = document.getElementById('apiKeyPanel');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const apiKeySave = document.getElementById('apiKeySave');
  apiKeyInput.value = getStoredKey();
  apiKeyToggle.addEventListener('click', () => { apiKeyPanel.hidden = !apiKeyPanel.hidden; });
  apiKeySave.addEventListener('click', () => {
    setStoredKey(apiKeyInput.value.trim());
    apiKeyPanel.hidden = true;
  });
  function openApiKeyPanel() {
    apiKeyPanel.hidden = false;
    if (window.innerWidth <= 760) app.classList.add('sidebar-open');
    apiKeyInput.focus();
  }

  // ---------- speech to text ----------
  const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  let recording = false;
  let baseText = '';

  if (SpeechRecognitionImpl) {
    micBtn.hidden = false;
    recognizer = new SpeechRecognitionImpl();
    recognizer.lang = 'it-IT';
    recognizer.continuous = true;
    recognizer.interimResults = true;

    recognizer.addEventListener('result', (e) => {
      let interim = '';
      let final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const chunk = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += chunk;
        else interim += chunk;
      }
      if (final) baseText = (baseText ? baseText + ' ' : '') + final.trim();
      input.value = (baseText + ' ' + interim).trim();
      autoGrow();
      sendBtn.disabled = !input.value.trim();
    });

    recognizer.addEventListener('error', () => {
      stopRecording();
      showError('Non sono riuscito ad ascoltare. Controlla il permesso del microfono e riprova.');
    });

    recognizer.addEventListener('end', () => {
      if (recording) {
        // interruzione inattesa: prova a riavviare
        try { recognizer.start(); } catch (e) { stopRecording(); }
      }
    });
  }

  function startRecording() {
    if (!recognizer || recording) return;
    hideError();
    baseText = input.value.trim();
    recording = true;
    micBtn.classList.add('recording');
    try { recognizer.start(); } catch (e) { stopRecording(); }
  }
  function stopRecording() {
    if (!recognizer) return;
    recording = false;
    micBtn.classList.remove('recording');
    try { recognizer.stop(); } catch (e) { /* già ferma */ }
  }
  micBtn.addEventListener('click', () => {
    if (recording) stopRecording();
    else startRecording();
  });

  // ---------- modalità vocale (conversazione a mani libere) ----------
  const voiceToggle = document.getElementById('voiceToggle');
  const voiceOverlay = document.getElementById('voiceOverlay');
  const voiceClose = document.getElementById('voiceClose');
  const voiceOrb = document.getElementById('voiceOrb');
  const voiceStatus = document.getElementById('voiceStatus');
  const voiceTranscript = document.getElementById('voiceTranscript');
  const voiceMute = document.getElementById('voiceMute');

  const speechSynthesisImpl = window.speechSynthesis;
  const voiceModeSupported = !!(SpeechRecognitionImpl && speechSynthesisImpl);

  let voiceRecognizer = null;
  let voiceState = 'idle'; // idle | listening | thinking | speaking
  let voiceOpen = false;
  let currentUtterance = null;

  if (voiceModeSupported) {
    voiceToggle.hidden = false;
    voiceRecognizer = new SpeechRecognitionImpl();
    voiceRecognizer.lang = 'it-IT';
    voiceRecognizer.continuous = false;
    voiceRecognizer.interimResults = true;

    voiceRecognizer.addEventListener('result', (e) => {
      let interim = '';
      let final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const chunk = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += chunk;
        else interim += chunk;
      }
      voiceTranscript.textContent = (final || interim).trim();
      if (final.trim()) handleVoiceTurn(final.trim());
    });

    voiceRecognizer.addEventListener('error', (e) => {
      if (!voiceOpen) return;
      if (e.error === 'no-speech') {
        // nessuno ha parlato: riprova ad ascoltare
        if (voiceState === 'listening') startVoiceListening();
        return;
      }
      setVoiceState('idle');
      voiceStatus.textContent = 'Non riesco ad ascoltare. Controlla il permesso del microfono.';
    });

    voiceRecognizer.addEventListener('end', () => {
      if (voiceOpen && voiceState === 'listening') {
        // il riconoscimento si ferma da solo dopo una pausa: riavvia se serve
        try { voiceRecognizer.start(); } catch (e) { /* già in corso */ }
      }
    });
  }

  function setVoiceState(state) {
    voiceState = state;
    voiceOrb.classList.remove('listening', 'thinking', 'speaking');
    voiceMute.hidden = state !== 'speaking';
    if (state === 'listening') {
      voiceOrb.classList.add('listening');
      voiceStatus.textContent = 'Ti ascolto…';
    } else if (state === 'thinking') {
      voiceOrb.classList.add('thinking');
      voiceStatus.textContent = 'Ci penso…';
    } else if (state === 'speaking') {
      voiceOrb.classList.add('speaking');
      voiceStatus.textContent = 'Sto rispondendo…';
    } else {
      voiceStatus.textContent = 'Tocca per iniziare a parlare';
    }
  }

  function startVoiceListening() {
    if (!voiceOpen) return;
    voiceTranscript.textContent = '';
    setVoiceState('listening');
    try { voiceRecognizer.start(); } catch (e) { /* già in corso */ }
  }

  function openVoiceMode() {
    if (!voiceModeSupported) {
      showError('La modalità vocale non è supportata da questo browser.');
      return;
    }
    if (recording) stopRecording();
    voiceOpen = true;
    voiceOverlay.classList.add('active');
    startVoiceListening();
  }

  function closeVoiceMode() {
    voiceOpen = false;
    speechSynthesisImpl.cancel();
    try { voiceRecognizer.stop(); } catch (e) { /* già ferma */ }
    voiceOverlay.classList.remove('active');
    setVoiceState('idle');
  }

  voiceToggle.addEventListener('click', openVoiceMode);
  voiceClose.addEventListener('click', closeVoiceMode);
  voiceMute.addEventListener('click', () => {
    if (voiceState === 'speaking') {
      speechSynthesisImpl.cancel();
      startVoiceListening();
    }
  });

  async function handleVoiceTurn(text) {
    try { voiceRecognizer.stop(); } catch (e) { /* già ferma */ }
    setVoiceState('thinking');

    if (greeting.style.display !== 'none') {
      greeting.style.display = 'none';
      chat.classList.add('active');
    }
    addUserBubble(text);
    history.push({ role: 'user', content: text });

    const sample = await getSample();
    if (!sample) {
      if (!voiceOpen) return;
      setVoiceState('idle');
      voiceStatus.textContent = 'La generazione AI non è disponibile in questa vista.';
      return;
    }

    const row = addAssistantBubble();
    const bubble = row.querySelector('.bubble');
    const messages = [
      { role: 'user', content: PERSONA_INTRO },
      { role: 'assistant', content: PERSONA_ACK },
      ...history
    ];

    try {
      const result = await sample(messages, { modelTier: 'default' });
      const finalText = (result && result.text) ? result.text.trim() : '';
      bubble.textContent = finalText || 'Non sono riuscito a rispondere.';
      history.push({ role: 'assistant', content: finalText });

      if (!voiceOpen) return;
      if (!finalText) { startVoiceListening(); return; }

      setVoiceState('speaking');
      voiceTranscript.textContent = finalText;
      currentUtterance = new SpeechSynthesisUtterance(finalText);
      currentUtterance.lang = 'it-IT';
      currentUtterance.onend = () => { if (voiceOpen) startVoiceListening(); };
      currentUtterance.onerror = () => { if (voiceOpen) startVoiceListening(); };
      speechSynthesisImpl.cancel();
      speechSynthesisImpl.speak(currentUtterance);
    } catch (err) {
      if (!voiceOpen) return;
      if (err && err.code === 'missing_key') {
        bubble.textContent = 'Aggiungi la tua chiave API di Google Gemini per usare Vibes.';
        setVoiceState('idle');
        voiceStatus.textContent = 'Serve una chiave API.';
        closeVoiceMode();
        openApiKeyPanel();
        return;
      }
      bubble.textContent = 'Non sono riuscito a rispondere. Riprova.';
      setVoiceState('idle');
      voiceStatus.textContent = 'Qualcosa è andato storto. Tocca per riprovare.';
    }
  }

  // ---------- stato conversazione ----------
  const PERSONA_INTRO = "Da ora in poi sei Vibes, un assistente che aiuta a scrivere contenuti (post social, articoli, email, descrizioni prodotto, script brevi) e a creare prompt dettagliati per generatori di immagini AI. Rispondi sempre in italiano, in modo diretto e naturale, senza premesse tipo 'Certo, ecco'. Se ti chiedono un prompt per immagini, scrivilo in inglese ma spiega brevemente in italiano cosa contiene.";
  const PERSONA_ACK = "Capito, sono pronto ad aiutarti.";
  let history = []; // {role, content}

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }
  input.addEventListener('input', () => {
    autoGrow();
    sendBtn.disabled = !input.value.trim();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (recording) stopRecording();
      trySend();
    }
  });

  document.querySelectorAll('.suggestion').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.prompt;
      autoGrow();
      sendBtn.disabled = false;
      trySend();
    });
  });

  newChatBtn.addEventListener('click', resetChat);

  function resetChat() {
    if (recording) stopRecording();
    if (voiceOpen) closeVoiceMode();
    history = [];
    chatInner.innerHTML = '';
    chat.classList.remove('active');
    greeting.style.display = 'flex';
    hideError();
    app.classList.remove('sidebar-open');
    input.value = '';
    autoGrow();
    sendBtn.disabled = true;
  }

  function showError(msg) {
    errLine.textContent = msg;
    errLine.classList.add('show');
  }
  function hideError() {
    errLine.classList.remove('show');
    errLine.textContent = '';
  }

  function addUserBubble(text) {
    const row = document.createElement('div');
    row.className = 'msg user';
    row.innerHTML = '<div class="bubble"></div>';
    row.querySelector('.bubble').textContent = text;
    chatInner.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  function addAssistantBubble() {
    const row = document.createElement('div');
    row.className = 'msg assistant';
    row.innerHTML = '<div class="msg-row"><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div><div class="assist-actions"></div></div>';
    chatInner.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  sendBtn.addEventListener('click', trySend);

  async function trySend() {
    const text = input.value.trim();
    if (!text) return;
    hideError();
    if (recording) stopRecording();

    if (greeting.style.display !== 'none') {
      greeting.style.display = 'none';
      chat.classList.add('active');
    }

    addUserBubble(text);
    history.push({ role: 'user', content: text });
    input.value = '';
    autoGrow();
    sendBtn.disabled = true;

    const sample = await getSample();
    if (!sample) {
      showError('La generazione AI non è disponibile in questa vista.');
      return;
    }

    const row = addAssistantBubble();
    const bubble = row.querySelector('.bubble');
    const actions = row.querySelector('.assist-actions');
    let started = false;

    const messages = [
      { role: 'user', content: PERSONA_INTRO },
      { role: 'assistant', content: PERSONA_ACK },
      ...history
    ];

    try {
      const result = await sample(messages, {
        modelTier: 'default',
        onText: ({ text: partial }) => {
          if (!started) { started = true; }
          bubble.textContent = partial;
          bubble.insertAdjacentHTML('beforeend', '<span class="cursor"></span>');
          chat.scrollTop = chat.scrollHeight;
        }
      });
      const finalText = (result && result.text) ? result.text.trim() : '';
      bubble.textContent = finalText || 'Non sono riuscito a generare una risposta. Riprova.';
      history.push({ role: 'assistant', content: finalText });

      if (finalText) {
        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.textContent = 'Copia';
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(finalText);
            copyBtn.textContent = 'Copiato';
            setTimeout(() => (copyBtn.textContent = 'Copia'), 1500);
          } catch (e) { /* clipboard non disponibile */ }
        });
        actions.appendChild(copyBtn);
      }
    } catch (err) {
      if (err && err.code === 'missing_key') {
        const msg = 'Aggiungi la tua chiave API di Google Gemini (link "Chiave API" nel menu) per usare Vibes.';
        bubble.textContent = msg;
        showError(msg);
        openApiKeyPanel();
      } else {
        const msg = (err && err.code === 'not_granted')
          ? 'Permesso non concesso, oppure la chiave API non è valida.'
          : 'Non sono riuscito a rispondere. Riprova.';
        bubble.textContent = msg;
        showError(msg);
      }
    }
    chat.scrollTop = chat.scrollHeight;
  }
})();
</script>
</body>
</html>
